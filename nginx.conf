server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Um endereço só para o Google: www.zarpa.tech vai para zarpa.tech
    if ($host = www.zarpa.tech) {
        return 301 https://zarpa.tech$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /site.webmanifest { default_type application/manifest+json; }
    location ~* \.(png|jpg|ico|svg)$ { expires 7d; }
}

